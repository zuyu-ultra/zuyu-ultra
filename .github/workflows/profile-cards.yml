name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&hide_border=false&rank_icon=github&include_all_commits=true&disable_animations=true&bg_color=F7F0DD&title_color=171717&text_color=171717&icon_color=E33A32&ring_color=1D4ED8&border_color=171717&border_radius=2"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=false&langs_count=6&disable_animations=true&bg_color=F7F0DD&title_color=E33A32&text_color=171717&border_color=171717&border_radius=2"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Harden cards for static renderers
        run: |
          perl -0pi -e 's/^\s*animation:[^\n]*\n//mg; s/opacity: 0;/opacity: 1;/g' profile/*.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update profile cards [skip ci]"
          git push
