name: Update profile scoreboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate the self-hosted scoreboard
        run: node scripts/generate-scoreboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit the updated scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/scoreboard.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update profile scoreboard [skip ci]"
          git push
