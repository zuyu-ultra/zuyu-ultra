<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">zuyu-ultra profile banner</title>
  <desc id="desc">A dark developer profile banner with the words zuyu-ultra, build learn share, and a terminal-style visual.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="156" y1="54" x2="1044" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.52" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#39D2C0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#8B949E" stroke-opacity="0.11"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1080" cy="54" r="98" fill="#58A6FF" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="1068" cy="254" r="112" fill="#A371F7" fill-opacity="0.14" filter="url(#glow)"/>
  <path d="M0 247C178 189 266 291 444 230C654 157 728 179 864 131C1008 81 1065 102 1200 48V300H0V247Z" fill="url(#accent)" fill-opacity="0.09"/>
  <rect x="72" y="66" width="92" height="92" rx="18" fill="#161B22" stroke="#30363D"/>
  <path d="M99 97L119 112L99 127" stroke="#58A6FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 130H144" stroke="#39D2C0" stroke-width="8" stroke-linecap="round"/>
  <text x="194" y="116" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="-2">zuyu-ultra</text>
  <text x="198" y="158" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="3">BUILD · LEARN · SHARE</text>
  <rect x="198" y="184" width="293" height="4" rx="2" fill="url(#accent)"/>
  <g fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <text x="198" y="225">$ creating useful things, one commit at a time</text>
    <text x="198" y="252" fill="#58A6FF">▹ web</text>
    <text x="275" y="252" fill="#A371F7">▹ tools</text>
    <text x="366" y="252" fill="#39D2C0">▹ experiments</text>
  </g>
  <g opacity="0.85">
    <rect x="936" y="100" width="176" height="112" rx="12" fill="#0D1117" stroke="#30363D"/>
    <circle cx="960" cy="124" r="6" fill="#FF7B72"/>
    <circle cx="980" cy="124" r="6" fill="#E3B341"/>
    <circle cx="1000" cy="124" r="6" fill="#3FB950"/>
    <path d="M960 154H1042" stroke="#30363D" stroke-width="8" stroke-linecap="round"/>
    <path d="M960 178H1085" stroke="#30363D" stroke-width="8" stroke-linecap="round"/>
    <path d="M960 202H1024" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
