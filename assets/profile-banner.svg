<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">zuyu — Wang Zhuyu developer profile</title>
  <desc id="description">An American comic-book banner with bold ink lines, halftone dots, action rays, and a laptop bursting from the page.</desc>
  <defs>
    <pattern id="inkDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#171717"/>
    </pattern>
    <pattern id="blueDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.6" fill="#F7F0DD"/>
    </pattern>
    <pattern id="redDots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#171717"/>
    </pattern>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0V18" stroke="#171717" stroke-width="4"/>
    </pattern>
    <clipPath id="panelClip">
      <rect width="1440" height="420" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1440" height="420" fill="#F7F0DD"/>

    <!-- Printed comic fields -->
    <path d="M0 0H430L310 420H0V0Z" fill="#1D4ED8"/>
    <path d="M0 0H430L310 420H0V0Z" fill="url(#blueDots)" opacity="0.34"/>
    <path d="M872 0H1440V420H792L872 0Z" fill="#E33A32"/>
    <path d="M872 0H1440V420H792L872 0Z" fill="url(#redDots)" opacity="0.2"/>
    <path d="M756 -20H936L826 440H646L756 -20Z" fill="url(#hatch)" opacity="0.18"/>

    <!-- Panel seams and speed lines -->
    <path d="M430 0L310 420" stroke="#171717" stroke-width="10"/>
    <path d="M872 0L792 420" stroke="#171717" stroke-width="10"/>
    <g stroke="#171717" stroke-width="5" stroke-linecap="round">
      <path d="M908 62L1030 132"/>
      <path d="M892 112L1010 159"/>
      <path d="M878 172L1002 184"/>
      <path d="M864 242L1000 222"/>
      <path d="M850 310L1007 257"/>
      <path d="M838 367L1025 285"/>
    </g>

    <!-- Identity caption -->
    <g transform="translate(72 42) rotate(-2)">
      <rect x="6" y="7" width="304" height="54" fill="#171717"/>
      <rect width="304" height="54" fill="#E33A32" stroke="#171717" stroke-width="6"/>
      <text x="22" y="37" fill="#FFFFFF" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="25" letter-spacing="2">WANG ZHUYU / DEVELOPER</text>
    </g>

    <!-- Main comic wordmark, with offset print shadow -->
    <text x="84" y="228" fill="#E33A32" stroke="#171717" stroke-width="11" paint-order="stroke fill" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="142" letter-spacing="4" transform="rotate(-3 84 228)">ZUYU</text>
    <text x="72" y="214" fill="#F7D647" stroke="#171717" stroke-width="11" paint-order="stroke fill" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="142" letter-spacing="4" transform="rotate(-3 72 214)">ZUYU</text>
    <path d="M82 244H641" stroke="#171717" stroke-width="8"/>
    <text x="84" y="276" fill="#171717" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="21" letter-spacing="2">WEB TOOLS · CLEAR SYSTEMS · REAL OUTPUTS</text>

    <!-- Website teaser caption -->
    <g transform="translate(70 310) rotate(1)">
      <path d="M0 0H660L638 72H18L0 0Z" fill="#F7D647" stroke="#171717" stroke-width="7" stroke-linejoin="round"/>
      <text x="28" y="31" fill="#171717" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="18" letter-spacing="2">PERSONAL SITE / ENTER HERE</text>
      <text x="28" y="59" fill="#171717" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="27" letter-spacing="3">ZHUYU.WANG →</text>
    </g>

    <!-- Action burst -->
    <polygon points="1164,78 1192,139 1267,92 1253,166 1354,149 1289,207 1393,238 1282,257 1358,332 1257,301 1238,390 1184,321 1126,390 1119,306 1015,346 1070,270 972,238 1074,203 1011,128 1107,162" fill="#F7D647" stroke="#171717" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="1164,116 1181,161 1230,129 1221,181 1281,175 1240,214 1301,236 1238,248 1274,295 1218,273 1204,327 1173,281 1138,327 1132,274 1074,298 1108,254 1052,237 1108,211 1074,168 1135,183" fill="url(#inkDots)" opacity="0.22"/>

    <!-- Comic laptop line art -->
    <g transform="rotate(-4 1174 238)">
      <rect x="1035" y="158" width="280" height="158" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="9"/>
      <rect x="1054" y="177" width="242" height="119" fill="#1D4ED8" stroke="#171717" stroke-width="5"/>
      <path d="M1102 211L1078 236L1102 261" stroke="#F7D647" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1247 211L1271 236L1247 261" stroke="#F7D647" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1174 203L1150 270" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M1007 316H1342L1377 352H971L1007 316Z" fill="#F7F0DD" stroke="#171717" stroke-width="9" stroke-linejoin="round"/>
      <path d="M1127 330H1220" stroke="#171717" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Speech balloon -->
    <g transform="translate(1042 26) rotate(2)">
      <path d="M15 5H319C330 5 339 14 339 25V88C339 99 330 108 319 108H116L77 137L85 108H15C4 108 -5 99 -5 88V25C-5 14 4 5 15 5Z" fill="#FFFFFF" stroke="#171717" stroke-width="7" stroke-linejoin="round"/>
      <text x="22" y="48" fill="#171717" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="28" letter-spacing="1">BUILD IT.</text>
      <text x="22" y="83" fill="#E33A32" stroke="#171717" stroke-width="1" paint-order="stroke fill" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="36" letter-spacing="2">SHIP IT!</text>
    </g>

    <!-- Registration marks and ink texture -->
    <g stroke="#171717" stroke-width="3" opacity="0.75">
      <path d="M24 24H58M41 7V41"/>
      <circle cx="41" cy="24" r="11"/>
      <path d="M1382 392H1416M1399 375V409"/>
      <circle cx="1399" cy="392" r="11"/>
    </g>
    <g fill="#171717" opacity="0.2">
      <circle cx="680" cy="54" r="3"/><circle cx="700" cy="44" r="2"/><circle cx="720" cy="57" r="3"/>
      <circle cx="749" cy="362" r="2"/><circle cx="767" cy="348" r="3"/><circle cx="787" cy="367" r="2"/>
    </g>
  </g>

  <rect x="5" y="5" width="1430" height="410" rx="11" stroke="#171717" stroke-width="10"/>
</svg>
