name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&hide_border=true&rank_icon=github&include_all_commits=true&disable_animations=true&bg_color=0A0F18&title_color=00D9FF&text_color=A7B7C9&icon_color=CAFF3D"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&disable_animations=true&bg_color=0A0F18&title_color=00D9FF&text_color=A7B7C9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Harden cards for static renderers
        run: |
          perl -0pi -e 's~</svg>\s*$~<style>.stagger{opacity:1!important;animation:none!important}.header,.rank-text,.rank-circle,#rect-mask rect,.lang-progress{animation:none!important}</style></svg>~' profile/*.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update profile cards [skip ci]"
          git push
